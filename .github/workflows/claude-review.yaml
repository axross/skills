name: Claude Code Review

# independent pull-request review: a separate Claude Code session, on a
# GitHub-hosted runner, under a bot identity distinct from the connected
# operator. triggered by a comment containing the review trigger phrase
# (`@claude review`; change it here and in
# .claude/skills/loop-engineering/SKILL.md together). it bootstraps REVIEW.md
# as the review policy, and is the authoritative review for the
# loop-engineering change loop, which posts the trigger phrase after opening a
# pull request and then addresses the findings left here.
#
# note: issue_comment workflows run only from the version on the default
# branch, so a change here takes effect after it merges — the pull request
# introducing it is always reviewed by the previous version.
#
# operator prerequisites (one-time; the workflow no-ops until the first two are
# done):
#   1. install the Claude GitHub App: https://github.com/apps/claude
#   2. add the repo secret CLAUDE_CODE_OAUTH_TOKEN, from `claude setup-token`
#      (Settings → Secrets and variables → Actions). for pay-as-you-go billing
#      instead, set ANTHROPIC_API_KEY and swap the `claude_code_oauth_token`
#      input below for `anthropic_api_key`.
#   3. optional, for telemetry: the repo variable
#      CLAUDE_OTEL_EXPORTER_OTLP_ENDPOINT and repo secret
#      CLAUDE_OTEL_EXPORTER_OTLP_HEADERS (Grafana Cloud supplies both from its
#      OpenTelemetry tile). scope the token to metrics:write and logs:write
#      only — the review session's own shell can read any job-level value. the
#      CLAUDE_ prefix keeps these clear of a cloning project's own OTLP
#      configuration. unset, telemetry is off and the reviewer is unaffected.
#
#      Grafana Cloud accepts cumulative temporality and nothing else, answering
#      Claude Code's delta default with `400 otlp parse error: invalid
#      temporality and type combination` — discarding the whole request while
#      telling the client nothing (#151). hence the temporality variable below.
#      a probe step POSTing to the endpoint was tried and removed (#156):
#      rejection is counted after authentication, so it reported healthy all
#      through the outage it was meant to expose.

on:
  issue_comment:
    types: [created]

# load-bearing safety property 1 of 3 — least privilege, read-only contents.
# the reviewer reads code and writes review output, nothing else: without
# contents:write it cannot push, whatever it is asked to do. the other writes
# cover inline comments, the summary comment, and the check-run.
permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  id-token: write # claude-code-action mints the Claude App token via OIDC

jobs:
  review:
    name: Review
    # load-bearing safety property 1 (continued) — the author-association gate.
    # fire only on a comment carrying the trigger phrase, on a pull request
    # rather than a plain issue, from an owner, member, or collaborator. this
    # is what stops an untrusted author from spending tokens or steering the
    # reviewer. do not widen the association list.
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude review') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    # job-level, not workflow-level: only a job passing the `if` gate joins the
    # group, so an unrelated issue_comment cannot cancel an in-flight review.
    # a fresh trigger comment still supersedes a running one.
    concurrency:
      group: claude-review-${{ github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # claude-code-action forwards these from the workflow `env` context into
    # the Claude Code process, so this block is the whole telemetry wiring — no
    # `with:` input and no prompt change. gating enablement on the endpoint
    # variable keeps observability from becoming a dependency of the review:
    # unset, no exporter starts at all.
    env:
      CLAUDE_CODE_ENABLE_TELEMETRY: ${{ vars.CLAUDE_OTEL_EXPORTER_OTLP_ENDPOINT != '' && '1' || '0' }}
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      # Claude Code has no default protocol; Grafana Cloud's gateway is HTTP.
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.CLAUDE_OTEL_EXPORTER_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.CLAUDE_OTEL_EXPORTER_OTLP_HEADERS }}
      # default is 60000, and whether Claude Code flushes at exit is
      # undocumented, so a sub-minute review would export nothing.
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
      OTEL_LOGS_EXPORT_INTERVAL: "5000"
      # without this every metrics push is discarded; see the header.
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: cumulative
      # fallback only: the --settings file below outranks this, because a
      # settings file's `env` beats the process environment. kept so the
      # session is still tagged if that file is ever missing.
      OTEL_RESOURCE_ATTRIBUTES: repository=skills,ci=github_actions,workflow=claude_review
    steps:
      # load-bearing safety property 2 of 3 — base-ref checkout. check out the
      # base ref and never the PR head: the review reads the diff through the
      # GitHub API, so untrusted head code never executes on the runner. the
      # checkout supplies only CLAUDE.md, REVIEW.md, and the project skills as
      # trusted review context.
      - name: Checkout
        uses: actions/checkout@v4

      # the CI resource attributes, which must live outside the repository
      # tree: a settings file's `env` outranks the process environment and the
      # checkout's .claude/settings.json sets repository=skills alone, while
      # claude-code-action deletes .claude/ wholesale before launching the CLI.
      # written unconditionally so --settings never points at a missing path.
      - name: Write the review session's telemetry settings
        run: |
          cat > "${RUNNER_TEMP}/claude-otel-settings.json" <<'JSON'
          {
            "env": {
              "OTEL_RESOURCE_ATTRIBUTES": "repository=skills,ci=github_actions,workflow=claude_review"
            }
          }
          JSON

      - name: Claude Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # the official code-review plugin posts only when invoked with
          # `--comment`, and not otherwise: inline comments plus one
          # `gh pr comment` summary, never a formal `gh pr review`. without the
          # flag it analyzes and stops silently.
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review https://github.com/${{ github.repository }}/pull/${{ github.event.issue.number }} --comment"
          # --allowedTools is not optional: the action does not honor a plugin
          # command's own `allowed-tools` frontmatter, so without it the plugin
          # is denied the tools it needs and posts nothing. `Bash` is broad
          # rather than per-subcommand because the plugin issues compound shell
          # commands no prefix matcher can match — safe only because of safety
          # property 2 (trusted base tree, never the PR head) and contents:read.
          claude_args: >-
            --append-system-prompt "Read REVIEW.md at the repository root and follow it as the highest-priority, review-only instructions for this review. Review this pull request even if it is a draft — do not skip it for being a draft. Do the ENTIRE review within this single turn: run every check and review pass yourself, synchronously and in order. Do NOT kick off background or parallel work and then end your turn to wait for it — this is a one-shot job that terminates the instant your turn ends, so anything you defer is lost and no review is posted. You MUST post your findings (inline comments plus a summary via `gh pr comment`) before your turn ends. This reviewer is advisory and does not gate merges."
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash"
            --disallowedTools "WebFetch,WebSearch,Task"
            --max-turns 200
            --settings "${{ runner.temp }}/claude-otel-settings.json"
          # load-bearing safety property 3 of 3 — background-task denial.
          # denying Task forces a synchronous review: the plugin otherwise fans
          # its passes out to sub-agents that run in the background, and this
          # single-shot action terminates the instant the main agent's turn
          # ends, orphaning them so nothing posts. WebFetch/WebSearch stay
          # denied so the reviewer makes no external calls.
          #
          # --max-turns is sized for the worst case because turn count is
          # high-variance even on a tiny diff; `timeout-minutes: 30` is the real
          # backstop, and the cap only guards against a pathological loop.
