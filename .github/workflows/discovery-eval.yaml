name: Discovery Evaluation

# Runs this repository's prompt fixture through REAL Claude Code skill discovery
# and reports which expected skills were missed and which unexpected ones fired.
#
# THIS IS NOT A GATE, AND MUST NOT BECOME ONE. It is non-deterministic, it costs
# money per run, and it needs a secret that fork pull requests do not receive.
# It is never a required check, it is not in merge-checks.yaml, and
# tests/repository/reporting-tools.test.mjs asserts it appears in this workflow
# and in no other — so wiring it into a gate has to be a deliberate act that
# breaks a test first.
#
# ── LOAD-BEARING SAFETY PROPERTY 1 of 4 — MANUAL DISPATCH IS THE ONLY TRIGGER.
# There is no event here that a pull request can raise. `workflow_dispatch`
# requires write access on the repository and always runs the workflow file from
# the DEFAULT BRANCH, so a contributor cannot cause a run, cannot cause one by
# editing this file in a pull request, and cannot cause one by having a label
# applied. Do NOT add `pull_request`, and do NOT add back `pull_request_target`:
# the latter runs in the base repository's context with a privileged token and
# is the classic footgun this workflow deliberately does not stand on.
#
# Properties 2-4 below are therefore defence in depth rather than the primary
# bound — the primary bound is that only a maintainer can start this at all.
# They are kept because the evaluation still reads pull request head content
# when a run names one, and because a workflow that is safe only by virtue of
# who can press the button is one trigger change away from not being safe.
#
# ── LOAD-BEARING SAFETY PROPERTY 2 of 4 — default-branch checkout, as in
# claude-review.yaml. Every line of EXECUTABLE code — the runner, the fixture,
# the baseline, package.json — comes from the default branch. A pull request
# head is never checked out, and `npm ci` never installs from head content.
#
# ── LOAD-BEARING SAFETY PROPERTY 3 of 4 — head skill text crosses as DATA,
# through an allowlist. The evaluation is only worth running against a CHANGED
# skill, so when a run names a pull request its `SKILL.md` files are fetched
# through the API and staged in $RUNNER_TEMP. scripts/discovery-eval/overlay.mjs
# is the real bound: it accepts only `.agents/skills/<kebab-name>/SKILL.md`,
# rejects traversal, absolute paths and backslashes, caps the size of what it
# accepts, and derives every destination from the DIFF PATH rather than from any
# `name:` field inside the head file. The `grep` filter below is convenience;
# the allowlist is the security property, and it is unit-tested.
#
# ── LOAD-BEARING SAFETY PROPERTY 4 of 4 — the evaluation subprocess carries
# only the credentials it cannot work without. Skills are prompt content, so
# allowlisted head text does reach a model. What that model can then do is
# nothing: one turn, only the `Skill` tool, no Bash, no network fetch.
# GITHUB_TOKEN is not in the evaluation step's environment, and overlay.mjs
# withholds anything credential-shaped from what it inherits regardless.
#
# Exactly three names cross that filter, each by an explicit allowlist entry
# rather than by the shape of its name: CLAUDE_CODE_OAUTH_TOKEN and
# ANTHROPIC_API_KEY, without which the subprocess cannot authenticate at all,
# and OTEL_EXPORTER_OTLP_HEADERS, whose VALUE is the telemetry credential
# below. The bound above is what makes all three safe, and it is the same
# bound in each case — a probe with no tools cannot read an environment back
# out. Adding a fourth is a deliberate edit to that allowlist, with the unit
# tests that go with it, and never a matter of picking a name the filter
# happens to miss.
#
# Operator prerequisite: the CLAUDE_CODE_OAUTH_TOKEN secret that
# claude-review.yaml already uses. No new secret, and no label, is required.
#
# Optional, for telemetry: the same two names claude-review.yaml documents —
# the repo variable CLAUDE_OTEL_EXPORTER_OTLP_ENDPOINT and the repo secret
# CLAUDE_OTEL_EXPORTER_OTLP_HEADERS (#146). Unset, no exporter starts and a
# run behaves exactly as it did before. Set, every probe reports as its own
# session under `workflow=discovery_eval`. Grafana Cloud accepts ONLY
# cumulative temporality, answering Claude Code's delta default with `400 otlp
# parse error: invalid temporality and type combination` and discarding the
# whole request silently (#151) — hence the temporality variable on the
# evaluation step.
#
# `emit_baseline` affects NONE of the four properties above. It adds one flag
# that makes the runner print an extra block, and one step that lifts that block
# into an artifact. It reads no head content, needs no permission beyond what is
# declared below, and never writes the repository — a human still commits the
# document deliberately.
#
# `determinism` affects none of them either. It narrows a run to ONE case and
# swaps which report the runner prints; it reads the same base-tree fixture,
# runs the same credential-free subprocess, and posts through the same step. It
# does change two things worth naming: the run gets its own concurrency group,
# because 30 sequential probes against an unchanged corpus are exactly what an
# unrelated dispatch must not cancel, and the posted comment's preamble follows
# the mode so the body is never introduced as a report it is not.
#
# AN EMITTING RUN CAN NOW FAIL ON PURPOSE. The runner records the skills the CLI
# loaded that the evaluation workspace did not install — a user-level tier it
# strips with `--setting-sources project`, and a managed-environment tier no flag
# can remove without removing the workspace's own skills too. When any remain,
# `--emit-baseline` prints its report and then exits 3 rather than emitting a
# document recorded against a corpus that was never the one measured. `set -euo
# pipefail` turns that into a failed job, and the extract and upload steps below
# do not run, so no artifact is produced. The report still reaches the job log
# through `tee`. An ordinary report run is unaffected and still exits 0.

on:
  workflow_dispatch:
    inputs:
      repeats:
        # NO DEFAULT, and that is load-bearing rather than tidy. A fixture case
        # may declare its own repeat count, and an explicitly passed --repeats
        # overrides every one of them. Defaulting this to "5" would mean CI
        # always passed the flag, so every per-case declaration would be
        # silently ignored in the one place that actually spends money — the
        # change would look right locally and save nothing here.
        description: "Runs per case, overriding what any case declares (leave blank to honour the fixture)"
        required: false
      pull_request:
        description: "Pull request number to evaluate head skills from (optional)"
        required: false
      emit_baseline:
        description: "Also emit a proposed baseline as a downloadable artifact (cannot be combined with a pull request)"
        required: false
        type: boolean
        default: false
      determinism:
        # Untyped and undefaulted, like `pull_request` and `repeats` above and
        # deliberately UNLIKE `emit_baseline`. Only the typed context applies a
        # declared default, so an input with no default must be read through
        # `github.event.inputs` — reading this one through `inputs` would work
        # by accident today and break the moment somebody gives it a type.
        description: "Case id to repeat against an unchanged corpus, measuring probe independence instead of running the fixture (cannot be combined with emit_baseline)"
        required: false

# Least privilege: read the base tree, write one comment. Nothing else. No
# contents:write — this never pushes, and its token cannot.
permissions:
  contents: read
  pull-requests: write

jobs:
  evaluate:
    name: Evaluate discovery
    # No `if:` guard is needed. workflow_dispatch is the only trigger, so there
    # is no other event shape to exclude — the gate is GitHub's own write-access
    # check on dispatching, not a condition evaluated here.
    concurrency:
      # A baseline run gets its own group. `cancel-in-progress` is right for a
      # report — the newer answer supersedes the older one — but an emitting run
      # produces a document that cost a full fixture's worth of probes, and
      # before this input existed every manual run shared one group. Somebody
      # dispatching an ordinary default-branch report would have cancelled a
      # re-record in flight and destroyed the measurement it paid for. Two
      # emitting runs still supersede each other, which is the intended reading.
      #
      # A determinism run earns the same protection for the same reason: it is
      # 30 sequential probes whose whole value is that the corpus did not change
      # underneath them, and without its own group it would land in
      # `discovery-eval-manual` where any ordinary dispatch could cancel it.
      #
      # ITS BRANCH IS EVALUATED FIRST, and that ordering is the point rather
      # than a style choice. Placed after `pull_request`, a determinism run that
      # also names a pull request would fall into `discovery-eval-<n>` and share
      # a group with an ordinary evaluation of that same pull request — which is
      # the half of the hazard the obvious fix misses. Two determinism runs on
      # one case still supersede each other, which is intended.
      group: discovery-eval-${{ github.event.inputs.determinism && format('determinism-{0}', github.event.inputs.determinism) || github.event.inputs.pull_request || (inputs.emit_baseline && 'emit-baseline') || 'manual' }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PR_NUMBER: ${{ github.event.inputs.pull_request }}
      REPEATS: ${{ github.event.inputs.repeats }}
      # `inputs`, not `github.event.inputs`, and deliberately unlike its two
      # neighbours: only the typed context applies a declared `default`, so a
      # dispatch that omits this input entirely still reads "false" here rather
      # than empty.
      EMIT_BASELINE: ${{ inputs.emit_baseline }}
      # `github.event.inputs` again, matching PR_NUMBER and REPEATS: this input
      # declares no default, so there is none for the typed context to apply.
      DETERMINISM: ${{ github.event.inputs.determinism }}
    steps:
      # MUTUALLY EXCLUSIVE, and refused rather than documented. When a dispatch
      # names a pull request the run overlays that pull request's head SKILL.md
      # files, so the emitted `corpus` would fingerprint UN-MERGED head text.
      # That document looks exactly like a committable baseline and is not one:
      # committing it would record a measurement against text that does not
      # exist on the default branch, which is the precise class of silent
      # staleness the corpus fingerprint exists to prevent.
      #
      # First step on purpose. It runs before the checkout, so a dispatch that
      # asks for the impossible costs nothing and spawns no probe.
      - name: Refuse to emit a baseline from head text
        if: env.EMIT_BASELINE == 'true' && env.PR_NUMBER != ''
        run: |
          echo "::error::emit_baseline cannot be combined with a pull request number. A run that overlays head SKILL.md files would fingerprint un-merged text, producing a document that looks committable and is not. Dispatch with emit_baseline and no pull request to re-record, or with a pull request and no emit_baseline to evaluate a branch."
          exit 1

      # A SECOND REFUSAL, AND A SEPARATE STEP RATHER THAN A WIDER `if:` ON THE
      # ONE ABOVE. That step is named for head text and its message is entirely
      # about pull request numbers; widening its condition would fire it on a
      # combination it does not describe, and a maintainer would read a reason
      # that has nothing to do with what they dispatched.
      #
      # The reason here is different too: a determinism run measures ONE case,
      # and a baseline is a fixture-wide document. There is no partial baseline
      # to emit, so the combination cannot be honoured in any form.
      #
      # `determinism` WITH `pull_request` is deliberately allowed — measuring a
      # changed skill's stability against its own head text is a sensible thing
      # to ask for, and it produces a report rather than a document.
      - name: Refuse to emit a baseline from a single-case probe
        if: env.EMIT_BASELINE == 'true' && env.DETERMINISM != ''
        run: |
          echo "::error::determinism cannot be combined with emit_baseline. A determinism run repeats ONE case, and a baseline is a fixture-wide document, so the run could only ever produce a partial one that looks committable and is not. Dispatch with determinism and no emit_baseline to measure a case, or with emit_baseline and no determinism to re-record."
          exit 1

      # SAFETY PROPERTY 2 — no `ref:` input, so this is always the default
      # branch. Never `github.event.pull_request.head.sha`, and never the ref of
      # a pull request named in the inputs.
      - name: Checkout default branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.220

      # SAFETY PROPERTY 3 — head SKILL.md files staged as data, at
      # repository-relative paths so the runner's allowlist judges the same
      # string the diff reported. GITHUB_TOKEN is scoped to THIS step. Skipped
      # entirely unless the dispatch named a pull request.
      - name: Stage changed head skills
        id: stage
        if: env.PR_NUMBER != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"

          staged="${RUNNER_TEMP}/head-skills"
          mkdir -p "${staged}"

          # Convenience filter only — overlay.mjs re-judges every path and is
          # the actual bound. Anything this lets through that the allowlist
          # rejects is reported and skipped, not silently overlaid.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | select(.status != "removed") | .filename' \
            | grep -E '^\.agents/skills/[a-z0-9-]+/SKILL\.md$' > "${RUNNER_TEMP}/changed.txt" || true

          while IFS= read -r path; do
            [ -z "${path}" ] && continue
            mkdir -p "${staged}/$(dirname "${path}")"
            gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${head_sha}" \
              --jq '.content' | base64 -d > "${staged}/${path}"
            echo "staged ${path}"
          done < "${RUNNER_TEMP}/changed.txt"

          echo "staged_dir=${staged}" >> "$GITHUB_OUTPUT"

      # SAFETY PROPERTY 4 — no GITHUB_TOKEN in this step's environment. The
      # secrets present are the one the CLI needs to authenticate at all and
      # the one the exporter needs to ship what it measures.
      #
      # STEP-LEVEL, deliberately unlike claude-review.yaml's job-level block.
      # That workflow needs the job context because claude-code-action forwards
      # from it; here run.mjs spawns the CLI itself, so this step's environment
      # IS the wiring — and this workflow already scopes GITHUB_TOKEN to the
      # steps that need it. A job-level block would hand the ingestion
      # credential to the staging step, beside GITHUB_TOKEN, for no benefit.
      #
      # No settings file is written, and none is needed: the scratch workspace
      # holds .claude/skills and nothing else, and the probe runs with
      # `--setting-sources project`, so there is no settings `env` block to
      # outrank the process environment the way #152 had to work around.
      - name: Run the evaluation
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Gating enablement on the endpoint variable keeps observability from
          # becoming a dependency of the evaluation: unset, no exporter starts.
          CLAUDE_CODE_ENABLE_TELEMETRY: ${{ vars.CLAUDE_OTEL_EXPORTER_OTLP_ENDPOINT != '' && '1' || '0' }}
          OTEL_METRICS_EXPORTER: otlp
          OTEL_LOGS_EXPORTER: otlp
          # Claude Code has no default protocol; Grafana Cloud's gateway is HTTP.
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.CLAUDE_OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.CLAUDE_OTEL_EXPORTER_OTLP_HEADERS }}
          # Without this every metrics push is discarded; see the header.
          OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: cumulative
          # Shorter than the reviewer's 10s/5s because the unit of work is
          # different: a review is one session of minutes, while this is one
          # session per probe — a whole fixture's worth of them, each lasting
          # seconds. A session is documented to flush at exit, but a probe exits
          # through `--max-turns 1` — a deliberate non-zero termination — so
          # these are the insurance that does not depend on that path flushing.
          # Under cumulative temporality an extra push repeats a cumulative
          # value rather than adding a count.
          OTEL_METRIC_EXPORT_INTERVAL: "5000"
          OTEL_LOGS_EXPORT_INTERVAL: "2000"
          # `workflow` is what separates these probes from the reviewer's
          # sessions, which carry workflow=claude_review. `eval_mode` separates
          # the three dispatch modes from each other: a 30-probe determinism run
          # and a full fixture run are otherwise indistinguishable.
          #
          # The mode expression mirrors the concurrency group above line for
          # line, and for the same reasons: determinism is evaluated FIRST, so a
          # determinism run that also names a pull request is still reported as
          # one, and each input is read through the context its own comment
          # requires — `inputs` for the typed, defaulted emit_baseline,
          # `github.event.inputs` for the untyped determinism.
          OTEL_RESOURCE_ATTRIBUTES: repository=skills,ci=github_actions,workflow=discovery_eval,eval_mode=${{ github.event.inputs.determinism && 'determinism' || (inputs.emit_baseline && 'baseline' || 'report') }}
        run: |
          set -euo pipefail
          # Passed ONLY when the dispatcher asked for a specific count. Left
          # blank, the runner honours whatever each case declares — which is
          # where the saving lives.
          args=()
          if [ -n "${REPEATS}" ]; then
            args+=(--repeats "${REPEATS}")
          fi
          if [ -n "${{ steps.stage.outputs.staged_dir || '' }}" ]; then
            args+=(--head-skills "${{ steps.stage.outputs.staged_dir }}")
            args+=(--head-sha "${{ steps.stage.outputs.head_sha }}")
          fi
          if [ "${EMIT_BASELINE}" = "true" ]; then
            args+=(--emit-baseline)
          fi
          # Both flags or neither. The runner refuses --determinism without
          # exactly one --only, so passing them apart would turn a dispatch
          # mistake into an exit-2 the maintainer has to decode from the log.
          if [ -n "${DETERMINISM}" ]; then
            args+=(--determinism --only "${DETERMINISM}")
          fi
          node scripts/discovery-eval/run.mjs "${args[@]}" | tee "${RUNNER_TEMP}/report.txt"

      # Uploaded as a file rather than left in the log. The document must land
      # byte-exact in a committed file, and transcribing ~90 lines of JSON out of
      # a log viewer is the one step of a re-record a human can silently get
      # wrong. The extractor validates through the same parseBaseline that reads
      # the committed file, so a bad slice fails the job instead of producing a
      # plausible artifact.
      - name: Extract the proposed baseline
        if: env.EMIT_BASELINE == 'true'
        run: |
          set -euo pipefail
          node scripts/discovery-eval/extract-baseline.mjs \
            "${RUNNER_TEMP}/report.txt" "${RUNNER_TEMP}/baseline.json"

      - name: Upload the proposed baseline
        if: env.EMIT_BASELINE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: proposed-baseline
          path: ${{ runner.temp }}/baseline.json
          if-no-files-found: error

      # The report body contains only base-tree prompts and allowlist-validated
      # kebab-case skill names — head SKILL.md CONTENT never reaches it — and is
      # posted from a file, so nothing is interpolated through a shell.
      - name: Post the report
        # Deliberately NOT always(): if the evaluation step failed there is no
        # report to post, and a step that then fails on a missing file reads as
        # a second, unrelated problem.
        #
        # A dispatch that names no pull request has nowhere to post; its report
        # is the job log, which is where the dispatcher is already looking.
        if: env.PR_NUMBER != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            # The preamble follows the mode. A determinism report contains no
            # verdicts and no delta, so introducing it as "which skills the
            # prompts surfaced" would describe a report nobody posted. The
            # not-a-gate line stays in both — it is true of every run here.
            if [ -n "${DETERMINISM}" ]; then
              echo "## Skill discovery determinism probe"
              echo
              echo "Repeats one fixture case against an unchanged corpus to measure whether sequential probes behave as the independent draws the arithmetic assumes."
            else
              echo "## Skill discovery evaluation"
              echo
              echo "Reports which skills the fixture's prompts actually surfaced."
            fi
            echo "**This is not a gate** — it never blocks a merge."
            echo
            echo '```text'
            cat "${RUNNER_TEMP}/report.txt"
            echo '```'
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > "${RUNNER_TEMP}/comment.md"
          gh pr comment "${PR_NUMBER}" --body-file "${RUNNER_TEMP}/comment.md"
