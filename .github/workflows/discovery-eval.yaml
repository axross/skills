name: Discovery Evaluation

# runs this repository's discovery fixture through REAL Claude Code skill
# discovery, as a per-case matrix, and lands the result through a pull
# request — the dispatch shape effect-eval.yaml established: admit -> probe
# (matrix) -> land. A pull-request dispatch takes a fourth job instead of
# landing: report, which posts a comment and commits nothing. A dispatch
# naming a `prompt` takes no fourth job at all — `probe` uploads its own
# probe records as an artifact and the run stops there, reaching neither
# `land` nor `report`.
#
# THIS IS NOT A GATE, AND MUST NOT BECOME ONE. It is non-deterministic, it
# costs money per probe, and it needs a secret that fork pull requests do not
# receive. It is never a required check, it is not in merge-checks.yaml, and
# tests/repository/reporting-tools.test.mjs asserts it appears in this
# workflow and in no other — so wiring it into a gate has to be a deliberate
# act that breaks a test first.
#
# ── why a matrix rather than a loop, and why per CASE rather than per probe.
# tools/discovery-eval/evaluate.mjs runs one case's whole set of repeats
# serially in one process — see that instrument's README, "Two probe modes"
# — because they share one materialized workspace and a warm cache would
# otherwise be paid for twice. The matrix unit this workflow adds on top is
# therefore the case, not the repeat: one job per case, `fail-fast: false`, so
# a failing case neither kills the run nor forces the others to be
# re-measured, and a re-dispatch of one case is the same unit as a job.
#
# ── admission binds before the fan-out, in `admit`, and it is FIXTURE-WIDE
# here — unlike the effect side's single-case admission. A dispatch naming no
# `case` matrixes over the whole fixture, pricing each selected case from its
# committed measurements where they exist and from the fixture's declared
# per-mode ceiling where they do not (see
# tools/discovery-eval/src/admission.mjs). A refusal exits 4 and nothing
# downstream runs, so a dispatch that does not fit its cap costs nothing. The
# recommended first dispatch after this workflow exists is still a single
# case — the fixture's current whole-run projection is recomputed from the
# committed fixture on every dispatch, and is stated (not restated here,
# where it would go stale the moment a case moves) in
# data/discovery-eval/README.md, "What is committed here".
#
# ── LOAD-BEARING SAFETY PROPERTY 1 of 6 — MANUAL DISPATCH IS THE ONLY
# TRIGGER. `workflow_dispatch` requires write access on the repository and
# always runs the workflow file from the DEFAULT BRANCH, so a contributor
# cannot cause a run, cannot cause one by editing this file in a pull
# request, and cannot cause one by having a label applied. Do NOT add
# `pull_request`, and do NOT add back `pull_request_target`. This is also
# what lets `prompt` need no allowlist the way a pull request's head text
# does (property 3 below): only someone with write access can supply it.
#
# ── LOAD-BEARING SAFETY PROPERTY 2 of 6 — default-branch checkout. Every
# job that checks out this repository (`admit`, `probe`, `land`) does so with
# no `ref:`, so it is always the default branch — the runner, the fixture,
# `package.json`, everything executable. A pull request head is never
# checked out and `npm ci` never installs from head content. `report` (the
# job a pull-request dispatch reaches instead of `land`) does not check out
# this repository at all — it only downloads artifacts and posts a comment,
# so there is no executable surface for this property to bind on there.
#
# ── LOAD-BEARING SAFETY PROPERTY 3 of 6 — head skill text crosses as DATA,
# through an allowlist. When a run names a pull request, `admit` fetches that
# pull request's changed `.agents/skills/<name>/SKILL.md` files through the
# API and stages them under `$RUNNER_TEMP`, uploaded as an artifact the probe
# jobs download. tools/discovery-eval/src/head-overlay.mjs is the real bound
# — it accepts only that one path shape, rejects traversal, absolute paths
# and backslashes, caps the size of what it accepts, and derives every
# destination from the DIFF PATH rather than from any `name:` field inside
# the head file. The `grep` filter in the stage step below is convenience;
# the allowlist is the security property, and it is unit-tested (see
# tests/discovery-eval/head-overlay.test.mjs).
#
# ── LOAD-BEARING SAFETY PROPERTY 4 of 6 — the probe job cannot write and
# never receives a credential beyond the one the CLI needs. It declares
# `permissions: {}`, and the "Run the probe" step's environment holds only
# `CLAUDE_CODE_OAUTH_TOKEN` — no `GITHUB_TOKEN`, whether the case is
# situated or bare. Downloading an artifact (the staged head skills, on a
# pull-request dispatch) uses the Actions runtime's own token, not
# `GITHUB_TOKEN`, so it needs no permission at all. Skills are prompt
# content, so allowlisted head text does reach a model in bare mode; what
# that model can then do is nothing — only the `Skill` tool, no Bash, no
# network fetch, no filesystem (see tools/discovery-eval/src/plan.mjs). The
# tool set is what bounds this, not the turn cap: that cap is 2, enough for one
# `Skill` call to finish, and raising it from 1 changed how much the model may
# say, never what it may reach.
#
# ── LOAD-BEARING SAFETY PROPERTY 5 of 6 — a dispatch naming a pull request
# runs every case bare and records nothing. `admit` resolves `mode` as a pure
# function of `pull_request`: non-empty and it parses as a positive integer,
# or the whole dispatch REFUSES before any probe spawns (a malformed
# reference is never silently treated as "no pull request" — see
# .github/scripts/lib/discovery-eval-fixture.mjs's parsePullRequestInput).
# `mode: "head"` structurally cannot reach `land` — that job's `if:` reads
# `needs.admit.outputs.records`, which `admit` sets to `"true"` only when
# `mode` is `"measurement"`, so the two are never re-derived a second way
# that could disagree (the discipline effect-eval-landing-plan.mjs's own
# header documents). It structurally cannot materialize a mock either:
# discovery-eval-probe-plan.mjs emits `measurementDir: null` on every
# head-mode plan, so a head-mode probe cell has no directory to hand
# evaluate.mjs as `--out` even if the shell around it tried — every probe
# argv it builds passes `--head-skills`, never `--out`, which is also the
# combination tools/discovery-eval/evaluate.mjs itself refuses outright (see
# tests/discovery-eval/evaluate.test.mjs, "refuses a request to record"). Both
# halves are asserted by tests/repository/discovery-eval-dispatch-plan.test.mjs
# rather than only documented here.
#
# ── LOAD-BEARING SAFETY PROPERTY 6 of 6 — a dispatch naming a `prompt`
# records nothing either, on the same structural shape as property 5 above.
# `admit` resolves `mode: "override"` as a pure function of `prompt` (empty
# means not an override dispatch — see
# .github/scripts/lib/discovery-eval-fixture.mjs's parsePromptInput), sets
# `records` to `"false"` for it exactly as it does for `"head"`, and REFUSES
# the whole dispatch before any probe spawns when `prompt` and `pull_request`
# are both non-empty — two different threat models and two different
# workspaces that must not meet in one run (a prompt override stays situated
# and takes text from a maintainer; a head evaluation forces bare and takes
# text from a pull request). `mode: "override"` structurally cannot
# materialize a mock either, for the same reason property 5 gives:
# discovery-eval-probe-plan.mjs emits `measurementDir: null` on every
# override-mode plan, and every probe argv it builds passes `--prompt`, never
# `--out` — the combination tools/discovery-eval/evaluate.mjs itself refuses
# outright. Unlike a head dispatch, an override dispatch does NOT force every
# case bare: it stays situated or bare exactly as the case declares, because
# forcing bare would move two variables — the prompt and the workspace — when
# the point is to hold the workspace fixed and vary only the prompt. Both
# halves, and the refusal, are asserted by
# tests/repository/discovery-eval-dispatch-plan.test.mjs rather than only
# documented here.
#
# Operator prerequisite: the CLAUDE_CODE_OAUTH_TOKEN secret that
# claude-review.yaml and effect-eval.yaml already use. No new secret, and no
# label, is required.

on:
  workflow_dispatch:
    inputs:
      case:
        description: "Case id, as declared in data/discovery-eval/fixture.json (blank runs the whole fixture)"
        required: false
      repeats:
        # NO DEFAULT, and that is load-bearing rather than tidy — see
        # effect-eval.yaml and the workflow this one replaces for the same
        # note. A fixture case may declare its own repeat count, and an
        # explicitly passed --repeats overrides every selected case's. Defaulting
        # this to a number would mean every dispatch passed the flag, so every
        # per-case declaration would be silently ignored in the one place that
        # actually spends money.
        description: "Repeats per case, overriding what every selected case declares (blank honours each case's own)"
        required: false
      pull_request:
        description: "Pull request number to evaluate changed skills from, bare, reporting only (optional)"
        required: false
      prompt:
        # requires repository write access to set at all — see SAFETY
        # PROPERTY 1 above — which is what lets this need no allowlist the
        # way pull_request's head text does. Refused together with
        # pull_request, in admit, before any probe spawns.
        description: "Override --case's declared prompt, reporting only, evaluated exactly as declared (optional; refused together with pull_request)"
        required: false
      dry_run:
        # typed and defaulted, so it is read through `inputs` rather than
        # `github.event.inputs` — only the typed context applies a declared
        # default. `case`, `repeats`, `pull_request` and `prompt` above
        # declare none, so they are read through `github.event.inputs`
        # throughout this file, the same distinction effect-eval.yaml and the
        # workflow this one replaces both record.
        description: "Rehearse every step with --dry-run passed to each probe; spend nothing"
        required: false
        type: boolean
        default: false

# least privilege at the top; the jobs that need more raise their own.
permissions:
  contents: read

concurrency:
  # grouped so two dispatches against the same pull request (or the same
  # case's measurement, or the same case's prompt override, or both against
  # the whole fixture) share a group, and never cancelled: cancelling a
  # matrix mid-flight destroys probes already paid for and leaves a case that
  # can never be completed in one wall-clock window — the same reasoning
  # effect-eval.yaml's own concurrency block gives. An override run gets its
  # own group, distinct from a measurement dispatch of the same case, so the
  # two neither cancel nor queue behind each other — they evaluate different
  # things (a rewritten prompt vs. the declared one) and spend from the same
  # cap independently.
  group: discovery-eval-${{ github.event.inputs.pull_request && format('pr-{0}', github.event.inputs.pull_request) || github.event.inputs.prompt && format('override-{0}', github.event.inputs.case || 'fixture') || format('measurement-{0}', github.event.inputs.case || 'fixture') }}
  cancel-in-progress: false

env:
  # pinned, and recorded in every probe's metadata.json: the CLI's version is
  # part of the condition, held fixed for the same reason effect-eval.yaml
  # pins one.
  CLAUDE_CODE_VERSION: 2.1.220

jobs:
  admit:
    name: Admit the dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents:read for the checkout below; pull-requests:read only to fetch a
    # named pull request's changed files and their content when this dispatch
    # is a head evaluation — never write, and never granted to probe or report.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.admit.outputs.mode }}
      cases: ${{ steps.admit.outputs.cases }}
      records: ${{ steps.admit.outputs.records }}
      cap-usd: ${{ steps.admit.outputs.cap-usd }}
      projected-usd: ${{ steps.admit.outputs.projected-usd }}
      head-sha: ${{ steps.stage.outputs.head-sha }}
    steps:
      # SAFETY PROPERTY 2 — no `ref:`, so this is always the default branch.
      - name: Checkout default branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - name: Install dependencies
        run: npm ci

      # exits 4 when the projection exceeds the fixture's cap, which fails
      # this job and skips everything downstream — before a single probe job
      # is even scheduled.
      - name: Resolve and admit the dispatch
        id: admit
        env:
          CASE: ${{ github.event.inputs.case }}
          REPEATS: ${{ github.event.inputs.repeats }}
          PR_NUMBER: ${{ github.event.inputs.pull_request }}
          # crosses as an environment variable into argv below, never
          # interpolated into this shell line — see SAFETY PROPERTY 6 above.
          PROMPT: ${{ github.event.inputs.prompt }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--dry-run-input "${DRY_RUN}")
          if [ -n "${CASE}" ]; then args+=(--case "${CASE}"); fi
          if [ -n "${REPEATS}" ]; then args+=(--repeats "${REPEATS}"); fi
          if [ -n "${PR_NUMBER}" ]; then args+=(--pull-request "${PR_NUMBER}"); fi
          if [ -n "${PROMPT}" ]; then args+=(--prompt "${PROMPT}"); fi
          node .github/scripts/discovery-eval-admit.mjs "${args[@]}"

      # SAFETY PROPERTY 3 — head SKILL.md files staged as data, at
      # repository-relative paths so the head-overlay allowlist judges the
      # same string the diff reported. `GITHUB_TOKEN` is scoped to this step
      # alone, by this job's own read-only `permissions:` above. Staged once
      # here rather than once per matrix cell, because the pull request's
      # diff does not vary by case — every probe job downloads the same
      # artifact instead of repeating these API calls.
      - name: Stage changed head skills
        id: stage
        if: steps.admit.outputs.mode == 'head'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.pull_request }}
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          echo "head-sha=${head_sha}" >> "$GITHUB_OUTPUT"

          staged="${RUNNER_TEMP}/head-skills"
          mkdir -p "${staged}"
          # a marker so the artifact upload below always has something to
          # find, even when this pull request changed no skill — a dispatch
          # naming such a pull request is unusual but not invalid; every
          # probe just overlays nothing and evaluates the base branch's text.
          touch "${staged}/.staged"

          # convenience filter only — head-overlay.mjs re-judges every path
          # and is the actual bound. anything this lets through that the
          # allowlist rejects is reported and skipped, not silently overlaid.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | select(.status != "removed") | .filename' \
            | grep -E '^\.agents/skills/[a-z0-9-]+/SKILL\.md$' > "${RUNNER_TEMP}/changed.txt" || true

          while IFS= read -r path; do
            [ -z "${path}" ] && continue
            mkdir -p "${staged}/$(dirname "${path}")"
            gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${head_sha}" \
              --jq '.content' | base64 -d > "${staged}/${path}"
            echo "staged ${path}"
          done < "${RUNNER_TEMP}/changed.txt"

      - name: Upload the staged head skills
        if: steps.admit.outputs.mode == 'head'
        uses: actions/upload-artifact@v4
        with:
          name: head-skills
          path: ${{ runner.temp }}/head-skills
          if-no-files-found: error
          retention-days: 1

  probe:
    name: Probe ${{ matrix.case }}
    needs: admit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # SAFETY PROPERTY 4 — this job spawns a model. no permission at all:
    # downloading the staged-head-skills artifact uses the Actions runtime's
    # own token, not GITHUB_TOKEN, so it needs none either.
    permissions: {}
    strategy:
      # one failed case must not discard the paid work of the others.
      # summarize.mjs notices a short repeat count through the fixture's own
      # declaration and reports the measurement as incomparable, which is the
      # right outcome: a partial case is a finding, not a silent success.
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.admit.outputs.cases) }}
    steps:
      # SAFETY PROPERTY 2 — no `ref:`, so this is always the default branch.
      - name: Checkout default branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Install the Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}

      # a simple env comparison, not a call into the plan script: admit
      # already refused the whole dispatch if PR_NUMBER were malformed (see
      # discovery-eval-admit.mjs), so by the time a probe job runs, PR_NUMBER
      # is either empty or a validated positive integer — the same gate the
      # workflow this one replaces used.
      - name: Download the staged head skills
        if: env.PR_NUMBER != ''
        env:
          PR_NUMBER: ${{ github.event.inputs.pull_request }}
        uses: actions/download-artifact@v4
        with:
          name: head-skills
          path: ${{ runner.temp }}/head-skills

      # the plan is resolved once, inside this one step, and read with `jq`
      # locally — never passed as a JSON blob through `${{ }}` into a later
      # step or an `if:` condition. that keeps this step the only place a
      # matrix cell's mode is decided, matching
      # effect-eval.yaml's own "Prepare the workspace" / "Run the probe" split
      # (each calls effect-eval-probe-plan.mjs itself rather than threading its
      # JSON across steps).
      #
      # SAFETY PROPERTY 4 — the only secret in this step's environment is the
      # one the CLI cannot authenticate without. Whether the case is situated
      # or bare, materializing its workspace and running its repeats both
      # happen inside tools/discovery-eval/evaluate.mjs, invoked once per
      # matrix cell — see that instrument's README, "Two entry points, one
      # process each".
      - name: Run the probe
        id: run
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          CASE: ${{ matrix.case }}
          REPEATS: ${{ github.event.inputs.repeats }}
          PR_NUMBER: ${{ github.event.inputs.pull_request }}
          # crosses as an environment variable into argv below, never
          # interpolated into a shell line — see SAFETY PROPERTY 6 above.
          PROMPT: ${{ github.event.inputs.prompt }}
          DRY_RUN: ${{ inputs.dry_run }}
          HEAD_SHA: ${{ needs.admit.outputs.head-sha }}
        run: |
          set -euo pipefail
          plan_args=(--case "${CASE}" --dry-run-input "${DRY_RUN}")
          if [ -n "${REPEATS}" ]; then plan_args+=(--repeats "${REPEATS}"); fi
          if [ -n "${PR_NUMBER}" ]; then plan_args+=(--pull-request "${PR_NUMBER}"); fi
          if [ -n "${PROMPT}" ]; then plan_args+=(--prompt "${PROMPT}"); fi
          plan="$(node .github/scripts/discovery-eval-probe-plan.mjs "${plan_args[@]}")"

          # never .args[] — see discovery-eval-probe-plan.mjs's header: the
          # prompt is free text that can hold a newline, and re-serializing it
          # through jq/mapfile would silently split it into broken argv
          # entries. It is appended below, directly from this step's own
          # PROMPT variable, the same way --head-skills and --head-sha are.
          mapfile -t args < <(jq -r '.args[]' <<<"${plan}")
          mode="$(jq -er '.mode' <<<"${plan}")"
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"

          if [ "${mode}" = "head" ]; then
            args+=(--head-skills "${RUNNER_TEMP}/head-skills")
            if [ -n "${HEAD_SHA}" ]; then args+=(--head-sha "${HEAD_SHA}"); fi
            # named per case, not "report.txt": the report job downloads every
            # case's artifact merged into ONE directory
            # (actions/download-artifact's `merge-multiple: true`), and a
            # shared filename would let one case's report silently overwrite
            # another's.
            node tools/discovery-eval/evaluate.mjs "${args[@]}" \
              | tee "${RUNNER_TEMP}/report-${CASE}.txt"
          elif [ "${mode}" = "override" ]; then
            args+=(--prompt "${PROMPT}")
            # evaluate.mjs refuses --out together with --prompt (it never
            # records — see that file's header), so stdout is the only
            # channel it has left for the metadata and transcript this run
            # produces: one JSON line per probe, holding the exact
            # metadata.json/transcript.jsonl shape a measurement would have
            # written to disk. This step explodes each line back into real
            # files, which is what makes the uploaded artifact hold real
            # probe records rather than only a summary.
            node tools/discovery-eval/evaluate.mjs "${args[@]}" \
              > "${RUNNER_TEMP}/override-report-${CASE}.jsonl"
            mkdir -p "${RUNNER_TEMP}/override/${CASE}"
            while IFS= read -r line; do
              [ -z "${line}" ] && continue
              probe_id="$(jq -r '.probeId' <<<"${line}")"
              dir="${RUNNER_TEMP}/override/${CASE}/probe-${probe_id}"
              mkdir -p "${dir}"
              jq '.metadata' <<<"${line}" > "${dir}/metadata.json"
              jq -r '.transcript' <<<"${line}" > "${dir}/transcript.jsonl"
            done < "${RUNNER_TEMP}/override-report-${CASE}.jsonl"
          else
            mkdir -p "${RUNNER_TEMP}/measurement"
            args+=(--out "${RUNNER_TEMP}/measurement")
            args+=(--run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
            node tools/discovery-eval/evaluate.mjs "${args[@]}"
            measurement_dir="$(jq -er '.measurementDir' <<<"${plan}")"
            echo "measurement-dir=${measurement_dir}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the case measurement
        if: steps.run.outputs.mode == 'measurement'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.run.outputs.measurement-dir }}
          path: ${{ runner.temp }}/measurement
          if-no-files-found: error
          retention-days: 7

      - name: Upload this case's report
        if: steps.run.outputs.mode == 'head'
        uses: actions/upload-artifact@v4
        with:
          name: head-report-${{ matrix.case }}
          path: ${{ runner.temp }}/report-${{ matrix.case }}.txt
          if-no-files-found: error
          retention-days: 1

      # 30 days, not the head report's 1: this is the only copy either the
      # metadata or the transcript will ever have — a prompt override never
      # records, so there is no measurement to re-derive it from later.
      - name: Upload this case's override records
        if: steps.run.outputs.mode == 'override'
        uses: actions/upload-artifact@v4
        with:
          name: discovery-eval-override-${{ matrix.case }}
          path: ${{ runner.temp }}/override/${{ matrix.case }}
          if-no-files-found: error
          retention-days: 30

  land:
    name: Land the measurement
    needs: [admit, probe]
    # SAFETY PROPERTY 5 — a head-mode dispatch's `records` output is always
    # "false" (see admit's header note above), so this job never runs for one.
    # `always()` so a partially-failed matrix still lands what it paid for:
    # the cases that succeeded are measured data that cannot be re-acquired
    # for free, and the comparability checks inside summarize.mjs are what
    # stop a partial one being read as a whole one.
    if: always() && needs.admit.result == 'success' && needs.admit.outputs.records == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci

      # every artifact this dispatch produced is a case-measurement directory
      # named exactly as it should sit under measurements/ — see
      # discovery-eval-probe-plan.mjs's header — so downloading straight into
      # that directory reconstructs the layout with no extra move step.
      - name: Download the case measurements
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: data/discovery-eval/measurements

      # every downloaded directory is untracked, because its name carries a
      # fresh random id no prior measurement could share — so `git status`
      # names exactly what this dispatch produced, never a prior one.
      - name: Identify this dispatch's own measurement directories
        id: new
        run: |
          set -euo pipefail
          mapfile -t dirs < <(git status --porcelain=1 -- data/discovery-eval/measurements \
            | sed -E 's/^\?\? //; s#/$##')
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "::error::no new measurement directory was downloaded; nothing to land."
            exit 1
          fi
          printf '%s\n' "${dirs[@]}"
          {
            echo "dirs<<EOF_DIRS"
            printf '%s\n' "${dirs[@]}"
            echo "EOF_DIRS"
          } >> "$GITHUB_OUTPUT"

      # the checks run here, before the commit, because merge-checks.yaml will
      # not run on the pull request this opens (opened with GITHUB_TOKEN — see
      # merge-checks.yaml's own header on why that pull request is excluded by
      # path).
      #
      # `--expect` comes from the landing plan rather than from a second
      # reading of the dispatch's input, mirroring effect-eval.yaml's own
      # land job exactly: two derivations of one fact can disagree, and a
      # check whose own argument is derived a second way is weaker than it
      # looks.
      - name: Refuse records the dispatch did not produce
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          plan="$(node .github/scripts/discovery-eval-landing-plan.mjs \
            --cases '${{ needs.admit.outputs.cases }}' \
            --dry-run-input "${DRY_RUN}" --run-id "${GITHUB_RUN_ID}")"
          args=(--expect "$(jq -er '.expect' <<<"${plan}")")
          while IFS= read -r dir; do
            [ -z "${dir}" ] && continue
            args+=(--dir "${dir}")
          done <<< "${{ steps.new.outputs.dirs }}"
          node .github/scripts/discovery-eval-check-mode.mjs "${args[@]}"

      - name: Derive the summaries and check comparability
        id: summarize
        continue-on-error: true
        run: node tools/discovery-eval/summarize.mjs

      # no `continue-on-error`: a measurement that fails the repository's own
      # gates is a defect in this instrument, not a finding about a skill.
      - name: Run the repository's own checks
        run: npm run check

      - name: Open the pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPARABLE: ${{ steps.summarize.outcome }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          plan="$(node .github/scripts/discovery-eval-landing-plan.mjs \
            --cases '${{ needs.admit.outputs.cases }}' \
            --dry-run-input "${DRY_RUN}" --run-id "${GITHUB_RUN_ID}")"
          branch="$(jq -er '.branch' <<<"${plan}")"
          title="$(jq -er '.title' <<<"${plan}")"
          mapfile -t draft < <(jq -r '.prFlags[]' <<<"${plan}")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add data/discovery-eval
          git commit -m "${title}" \
                     -m "Dispatched from ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          git push -u origin "${branch}"

          {
            jq -er '.bodyPreamble' <<<"${plan}"
            echo
            if [ "${COMPARABLE}" = "success" ]; then
              echo "Every comparability check passed."
            else
              echo "**At least one comparability check FAILED.** The result is committed anyway —"
              echo "a case whose probes did not run under the same conditions is a finding worth"
              echo "keeping, not data to discard — but the difference it reports cannot be"
              echo "attributed to the skill. See the run log and each \`summary.json\`."
            fi
            echo
            echo "Admitted at a \$${{ needs.admit.outputs.cap-usd }} cap against a projected"
            echo "\$${{ needs.admit.outputs.projected-usd }}."
            echo
            echo "\`merge-checks.yaml\` does not run on this pull request: it is opened with"
            echo "\`GITHUB_TOKEN\`, and the gate excludes these paths. The checks it would have"
            echo "run — the drift check, the comparability checks, and \`npm run check\` — ran in"
            echo "the dispatch before this branch was committed."
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > "${RUNNER_TEMP}/body.md"

          gh pr create \
            --title "${title}" \
            --body-file "${RUNNER_TEMP}/body.md" \
            --base "${{ github.ref_name }}" \
            --head "${branch}" \
            "${draft[@]}"

  report:
    name: Report the head evaluation
    needs: [admit, probe]
    # SAFETY PROPERTY 5's other face: this is the ONLY job a pull-request
    # dispatch reaches after `probe`. It holds no `contents:` permission at
    # all, so even if it ran for a measurement dispatch by mistake it could
    # not commit one — `land` above is the only job that can.
    if: always() && needs.admit.result == 'success' && needs.admit.outputs.mode == 'head'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - name: Download every case's report
        uses: actions/download-artifact@v4
        with:
          pattern: "head-report-*"
          path: ${{ runner.temp }}/reports
          merge-multiple: true

      # the report's body is base-tree prompts and allowlist-validated
      # kebab-case skill names plus exit codes — head SKILL.md CONTENT never
      # reaches it, because evaluate.mjs's own report line names no file
      # content, only the case id and the CLI's exit code — and is posted
      # from a file, so nothing is interpolated through a shell.
      - name: Post the report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.inputs.pull_request }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          {
            echo "## Skill discovery evaluation — pull request head"
            echo
            echo "Evaluated this pull request's changed skills, bare — no filesystem, no"
            echo "shell — routing on the prompt alone. **This records nothing**: a head"
            echo "evaluation is never compared with a situated measurement, and never lands."
            if [ "${DRY_RUN}" = "true" ]; then
              echo
              echo "**This was a rehearsal.** No model was spawned; every exit code below is"
              echo "synthetic."
            fi
            echo "**This is not a gate** — it never blocks a merge."
            echo
            echo '```text'
            for f in "${RUNNER_TEMP}"/reports/report-*.txt; do
              [ -e "${f}" ] || continue
              cat "${f}"
            done
            echo '```'
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > "${RUNNER_TEMP}/comment.md"
          gh pr comment "${PR_NUMBER}" --body-file "${RUNNER_TEMP}/comment.md"
