name: Merge Checks

# The project's own CI: the format, lint, and test checks that gate merges to
# the default branch. Each gate is its own job, so the three run in parallel and
# one failing gate still lets the others report; none declares `needs`. The
# Tests job is the wide one — besides the validator unit tests it runs the
# relative-link, skill-structure, and installed-copy checks over this repository
# (see tests/repository/), which were once separate gates of their own. This is
# the CI the loop-engineering change loop's tail polls after a push (see
# .claude/skills/loop-engineering/SKILL.md). Keep REVIEW.md's do-not-report list
# in sync with exactly what these jobs enforce.
#
# Every check step invokes an npm script, and
# tests/repository/gate-consistency.test.mjs asserts that the set of scripts run
# here equals the set in package.json's `check` chain — so a gate added to one
# and forgotten in the other fails rather than silently going unenforced in the
# place it was missed. That comparison collects every `run:` line in this file
# regardless of which job holds it, so splitting the gates across jobs does not
# weaken it.

on:
  pull_request:
  push:
    branches: [main] # ← the project's default branch

# Cancel superseded runs on PR refs only: on the default branch every push is a
# distinct merged commit whose checks must run to completion, or back-to-back
# merges leave earlier commits with cancelled (never-completed) verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# ── THE MEASUREMENT PULL REQUEST IS EXCLUDED, EXPLICITLY.
#
# effect-eval.yaml opens a pull request with GITHUB_TOKEN, and GitHub does not
# fire workflows on those — so today these gates already do not run on it. That
# exclusion is currently an accident of platform behaviour, and this guard turns
# it into a declared one, so a future change in how GitHub treats
# GITHUB_TOKEN-authored pull requests cannot silently move which gate is
# responsible for measurement data.
#
# The division it declares: measurement data is checked by the dispatch that
# produced it, before the commit — the drift check, the comparability checks,
# and this repository's own `npm run check` all run inside effect-eval.yaml's
# landing job. Code is checked here. Nothing is checked by neither.
#
# THREE THINGS ABOUT THE SHAPE ARE DELIBERATE.
#
# It is a job-level `if:` and not a trigger-level `paths-ignore`. A workflow
# skipped by a path or branch filter never reports at all, so a required status
# check would stay pending forever; a job skipped by `if:` reports and satisfies
# it.
#
# It keys on the AUTHOR as well as the branch prefix. A branch-name-only guard
# would let any contributor skip all three gates by naming their branch
# `measurement/…`. The author of a GITHUB_TOKEN-opened pull request is not
# something a contributor can forge.
#
# It is repeated on each job rather than factored into a shared gate job,
# because that would need `needs:` — and the note above records that no job here
# declares one, so that a failing gate still lets the others report.
#
# tests/repository/reporting-tools.test.mjs asserts all three jobs carry it.
# Note that it adds no `run:` line, so the gate-consistency coupling above is
# unaffected.

jobs:
  format-validation:
    name: Format Validation
    if: >-
      ${{ !(github.event_name == 'pull_request'
            && github.event.pull_request.user.login == 'github-actions[bot]'
            && startsWith(github.head_ref, 'measurement/')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - name: Dependency Installation
        run: "npm install"
      - name: Format Check
        run: "npm run format:check"

  lint:
    name: Lint
    if: >-
      ${{ !(github.event_name == 'pull_request'
            && github.event.pull_request.user.login == 'github-actions[bot]'
            && startsWith(github.head_ref, 'measurement/')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - name: Dependency Installation
        run: "npm install"
      - name: Lint
        run: "npm run lint"

  tests:
    name: Tests
    if: >-
      ${{ !(github.event_name == 'pull_request'
            && github.event.pull_request.user.login == 'github-actions[bot]'
            && startsWith(github.head_ref, 'measurement/')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - name: Dependency Installation
        run: "npm install"
      - name: Tests
        run: "npm test"
