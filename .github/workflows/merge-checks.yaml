name: Merge Checks

# The project's own CI: the format, lint, and test checks that gate merges to
# the default branch. Each gate is its own job, so the three run in parallel and
# one failing gate still lets the others report; none declares `needs`. The
# Tests job is the wide one — besides the validator unit tests it runs the
# relative-link, skill-structure, and installed-copy checks over this repository
# (see tests/repository/), which were once separate gates of their own. This is
# the CI the loop-engineering change loop's tail polls after a push (see
# .claude/skills/loop-engineering/SKILL.md). Keep REVIEW.md's do-not-report list
# in sync with exactly what these jobs enforce.
#
# Every check step invokes an npm script, and
# tests/repository/gate-consistency.test.mjs asserts that the set of scripts run
# here equals the set in package.json's `check` chain — so a gate added to one
# and forgotten in the other fails rather than silently going unenforced in the
# place it was missed. That comparison collects every `run:` line in this file
# regardless of which job holds it, so splitting the gates across jobs does not
# weaken it.

on:
  pull_request:
    # a pull request whose changed files are all under these paths carries
    # measurement data and no code, so this workflow does not start for it. see
    # the note below the concurrency block for why, and for what checks that
    # data gets instead.
    paths-ignore:
      - "data/*/measurements/**"
      - "data/*/summary.json"
  push:
    # deliberately no paths-ignore here. once a measurement merges the gates
    # run against the merged tree, drift check included, so measurement data is
    # exempt from BLOCKING a pull request rather than from being checked.
    branches: [main] # ← the project's default branch

# Cancel superseded runs on PR refs only: on the default branch every push is a
# distinct merged commit whose checks must run to completion, or back-to-back
# merges leave earlier commits with cancelled (never-completed) verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# ── why the measurement pull request is excluded, and why by path.
#
# effect-eval.yaml opens a pull request with GITHUB_TOKEN, and GitHub does not
# fire workflows on those — so these gates already did not run on it. that was
# an accident of platform behaviour; the `paths-ignore` above makes it a
# declared division, so a future change in how GitHub treats
# GITHUB_TOKEN-authored pull requests cannot silently move which gate is
# responsible for measurement data.
#
# the division: measurement data is checked by the dispatch that produced it,
# before the commit, and again here on the push to the default branch once it
# merges. code is checked here. nothing is checked by neither.
#
# by path rather than by branch name for two reasons. GitHub cannot do it by
# branch name at all — `branches` and `branches-ignore` on a `pull_request`
# trigger filter the base branch, not the head. and a path key is better
# anyway: a branch name is a public string any contributor could adopt to skip
# all three gates, where a path says the pull request changes nothing but
# measurement data, which is a fact about its contents.
#
# what this costs: a skipped workflow reports nothing, so if these three ever
# become required status checks on the default branch, a measurement pull
# request would sit pending forever. the fix then is to move the exclusion back
# to a job-level `if:` keyed on both the branch prefix and the
# `github-actions[bot]` author — a skipped job reports and satisfies a required
# check, where a skipped workflow does not.
#
# tests/repository/reporting-tools.test.mjs asserts the exclusion is present and
# scoped to those two paths. it adds no `run:` line, so the gate-consistency
# coupling above is unaffected.

jobs:
  format-validation:
    name: Format Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - name: Dependency Installation
        run: "npm install"
      - name: Format Check
        run: "npm run format:check"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - name: Dependency Installation
        run: "npm install"
      - name: Lint
        run: "npm run lint"

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - name: Dependency Installation
        run: "npm install"
      - name: Tests
        run: "npm test"
